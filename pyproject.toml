[project]
name = "light-work"
version = "0.1.0"
description = "A harness for Claude Code that cuts token cost per feature without lowering quality."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
lw = "lightwork.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lightwork"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
