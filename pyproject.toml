[project]
name = "light-work"
version = "0.1.0"
description = "A harness for Claude Code that cuts token cost per feature without lowering quality."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
lw = "lightwork.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lightwork"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Install a real copy of the package, even for `uv sync`'s editable install, and rebuild it
# when source changes. Something on this Mac sets the hidden flag on dot-folders, and Python
# skips hidden .pth files, so an editable install alone breaks `uv run lw` at random.
[tool.hatch.build.targets.wheel.force-include]
"src/lightwork" = "lightwork"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
