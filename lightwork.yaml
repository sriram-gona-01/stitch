# Light Work configuration.
paths:
  # Every path this repo has lived at, so transcripts from before a rename are still found.
  aliases:
    - ~/Desktop/AI_Eng_RM/projects/stitch
    - ~/Desktop/AI_Eng_RM/projects/light-work
verify:
  # Fast check run by the Stop gate (lint / type-check, not the full test suite).
  fast_cmd: ".venv/bin/python -m compileall -q src tests"
  timeout_seconds: 30
  max_failure_lines: 20
offload:
  head_lines: 5
  tail_lines: 10
  max_failure_lines: 20
advisor:
  # Add a one-line advisory to prompts in non-baseline arms. Off by default, so experiments stay clean.
  hook_enabled: false
  # Context size (tokens) at which the advisory fires.
  context_warn_tokens: 150000
  # Estimates used until there is measured data. `lw advise` prints them.
  brief_tokens: 500
  handoff_tokens: 2000
  compact_tokens: 6000
  default_remaining_turns: 10
  # Recommend a change only if it saves at least this fraction versus staying.
  min_saving: 0.1
